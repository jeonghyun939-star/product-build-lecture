<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 번호 생성기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .container {
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 22px;
    color: #1a1a2e;
    margin: 0 0 8px;
  }
  p.sub {
    color: #888;
    font-size: 14px;
    margin: 0 0 28px;
  }
  .sets {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
  }
  .set-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f6f6f9;
    border-radius: 10px;
    padding: 8px 10px;
  }
  .set-label {
    font-size: 12px;
    font-weight: 700;
    color: #999;
    width: 22px;
    flex-shrink: 0;
  }
  .balls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ball {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    opacity: 0;
    transform: scale(0.3);
    animation: pop 0.3s forwards;
    flex-shrink: 0;
  }
  @keyframes pop {
    to { opacity: 1; transform: scale(1); }
  }
  .c1 { background: #fbc400; }
  .c2 { background: #69c8f2; }
  .c3 { background: #ff7272; }
  .c4 { background: #aaaaaa; }
  .c5 { background: #b0d840; }
  button {
    background: #1a1a2e;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 0;
    width: 100%;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: #33334d; }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>

<div class="container">
  <h1>🎱 로또 번호 생성기</h1>
  <p class="sub">버튼을 눌러 행운의 번호 5세트를 뽑아보세요</p>
  <div class="sets" id="sets"></div>
  <button onclick="generateLotto()">번호 생성하기</button>
</div>

<script>
function getBallColorClass(num) {
  if (num <= 10) return 'c1';
  if (num <= 20) return 'c2';
  if (num <= 30) return 'c3';
  if (num <= 40) return 'c4';
  return 'c5';
}

function generateOneSet() {
  const numbers = new Set();
  while (numbers.size < 6) {
    numbers.add(Math.floor(Math.random() * 45) + 1);
  }
  return Array.from(numbers).sort((a, b) => a - b);
}

function generateLotto() {
  const setsContainer = document.getElementById('sets');
  setsContainer.innerHTML = '';

  for (let s = 0; s < 5; s++) {
    const sorted = generateOneSet();

    const row = document.createElement('div');
    row.className = 'set-row';

    const label = document.createElement('div');
    label.className = 'set-label';
    label.textContent = (s + 1) + '.';
    row.appendChild(label);

    const ballsContainer = document.createElement('div');
    ballsContainer.className = 'balls';

    sorted.forEach((num, i) => {
      const ball = document.createElement('div');
      ball.className = 'ball ' + getBallColorClass(num);
      ball.textContent = num;
      ball.style.animationDelay = (s * 0.1 + i * 0.05) + 's';
      ballsContainer.appendChild(ball);
    });

    row.appendChild(ballsContainer);
    setsContainer.appendChild(row);
  }
}

generateLotto();
</script>

</body>
</html>
