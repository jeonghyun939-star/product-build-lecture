<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>로또 번호 생성기</title>
<style>
  :root {
    --bg-outer: #1a1a2e;
    --bg-container: #ffffff;
    --text-title: #1a1a2e;
    --text-sub: #888888;
    --row-bg: #f6f6f9;
    --label-color: #999999;
    --btn-bg: #1a1a2e;
    --btn-bg-hover: #33334d;
    --btn-text: #ffffff;
    --shadow: rgba(0,0,0,0.3);
    --toggle-bg: #f6f6f9;
    --toggle-border: #e2e2e8;
  }
  [data-theme="dark"] {
    --bg-outer: #0c0c14;
    --bg-container: #1e1e2e;
    --text-title: #f2f2f5;
    --text-sub: #9a9ab0;
    --row-bg: #2a2a3c;
    --label-color: #8a8aa0;
    --btn-bg: #6c6cff;
    --btn-bg-hover: #8080ff;
    --btn-text: #ffffff;
    --shadow: rgba(0,0,0,0.5);
    --toggle-bg: #2a2a3c;
    --toggle-border: #3a3a50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px;
    background: var(--bg-outer);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background 0.3s ease;
  }
  @media (min-width: 1300px) {
    body {
      flex-direction: row;
      align-items: flex-start;
    }
    .container,
    .comments-container {
      width: 420px;
      flex-shrink: 0;
    }
  }
  .container {
    position: relative;
    background: var(--bg-container);
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 50px var(--shadow);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .theme-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--toggle-border);
    background: var(--toggle-bg);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease, transform 0.1s;
  }
  .theme-toggle:active { transform: scale(0.92); }
  h1 {
    font-size: 22px;
    color: var(--text-title);
    margin: 0 0 8px;
    transition: color 0.3s ease;
  }
  p.sub {
    color: var(--text-sub);
    font-size: 14px;
    margin: 0 0 28px;
    transition: color 0.3s ease;
  }
  .sets {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
  }
  .set-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--row-bg);
    border-radius: 10px;
    padding: 8px 10px;
    transition: background 0.3s ease;
  }
  .set-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--label-color);
    width: 22px;
    flex-shrink: 0;
    transition: color 0.3s ease;
  }
  .balls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ball {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    opacity: 0;
    transform: scale(0.3);
    animation: pop 0.3s forwards;
    flex-shrink: 0;
  }
  @keyframes pop {
    to { opacity: 1; transform: scale(1); }
  }
  .c1 { background: #fbc400; }
  .c2 { background: #69c8f2; }
  .c3 { background: #ff7272; }
  .c4 { background: #aaaaaa; }
  .c5 { background: #b0d840; }
  button {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 10px;
    padding: 14px 0;
    width: 100%;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: var(--btn-bg-hover); }
  button:active { transform: scale(0.98); }
  .form-container { text-align: left; }
  .form-container h2,
  .comments-container h2 {
    font-size: 18px;
    color: var(--text-title);
    margin: 0 0 4px;
    text-align: center;
    transition: color 0.3s ease;
  }
  .form-container p.sub { text-align: center; }
  .comments-container {
    width: 100%;
    max-width: 420px;
  }
  .comments-container h2 { margin-bottom: 16px; }
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--label-color);
    margin-bottom: 6px;
    transition: color 0.3s ease;
  }
  .field input,
  .field textarea {
    width: 100%;
    border: 1px solid var(--toggle-border);
    background: var(--row-bg);
    color: var(--text-title);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
  }
  .field textarea { min-height: 90px; }
  .field input:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--btn-bg);
  }
  .form-status {
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .form-status.success { color: #4caf82; }
  .form-status.error { color: #ff7272; }
</style>
</head>
<body>

<div class="container">
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="테마 전환"></button>
  <h1>🎱 로또 번호 생성기</h1>
  <p class="sub">버튼을 눌러 행운의 번호 5세트를 뽑아보세요</p>
  <div class="sets" id="sets"></div>
  <button onclick="generateLotto()">번호 생성하기</button>
</div>

<div class="container form-container">
  <h2>🤝 제휴 문의</h2>
  <p class="sub">아래 내용을 남겨주시면 검토 후 회신드리겠습니다</p>
  <form id="partnerForm" action="https://formspree.io/f/mykrgzae" method="POST">
    <div class="field">
      <label for="name">이름</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="company">회사 / 서비스명</label>
      <input type="text" id="company" name="company">
    </div>
    <div class="field">
      <label for="message">문의 내용</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <button type="submit" id="partnerSubmit">문의 보내기</button>
    <div class="form-status" id="partnerStatus"></div>
  </form>
</div>

<div class="container comments-container">
  <h2>💬 댓글</h2>
  <div id="disqus_thread"></div>
  <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
</div>

<script>
var disqus_config = function () {
  this.page.url = window.location.href;
  this.page.identifier = window.location.pathname;
};

(function() {
  var d = document, s = d.createElement('script');
  s.src = 'https://hello-disqus-1.disqus.com/embed.js';
  s.setAttribute('data-timestamp', +new Date());
  (d.head || d.body).appendChild(s);
})();
</script>

<script>
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

(function initTheme() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));
})();

function getBallColorClass(num) {
  if (num <= 10) return 'c1';
  if (num <= 20) return 'c2';
  if (num <= 30) return 'c3';
  if (num <= 40) return 'c4';
  return 'c5';
}

function generateOneSet() {
  const numbers = new Set();
  while (numbers.size < 6) {
    numbers.add(Math.floor(Math.random() * 45) + 1);
  }
  return Array.from(numbers).sort((a, b) => a - b);
}

function generateLotto() {
  const setsContainer = document.getElementById('sets');
  setsContainer.innerHTML = '';

  for (let s = 0; s < 5; s++) {
    const sorted = generateOneSet();

    const row = document.createElement('div');
    row.className = 'set-row';

    const label = document.createElement('div');
    label.className = 'set-label';
    label.textContent = (s + 1) + '.';
    row.appendChild(label);

    const ballsContainer = document.createElement('div');
    ballsContainer.className = 'balls';

    sorted.forEach((num, i) => {
      const ball = document.createElement('div');
      ball.className = 'ball ' + getBallColorClass(num);
      ball.textContent = num;
      ball.style.animationDelay = (s * 0.1 + i * 0.05) + 's';
      ballsContainer.appendChild(ball);
    });

    row.appendChild(ballsContainer);
    setsContainer.appendChild(row);
  }
}

generateLotto();

const partnerForm = document.getElementById('partnerForm');
const partnerStatus = document.getElementById('partnerStatus');
const partnerSubmit = document.getElementById('partnerSubmit');

partnerForm.addEventListener('submit', async function (e) {
  e.preventDefault();
  partnerSubmit.disabled = true;
  partnerStatus.textContent = '전송 중...';
  partnerStatus.className = 'form-status';

  try {
    const response = await fetch(partnerForm.action, {
      method: 'POST',
      body: new FormData(partnerForm),
      headers: { 'Accept': 'application/json' }
    });

    if (response.ok) {
      partnerStatus.textContent = '문의가 정상적으로 접수되었습니다. 감사합니다!';
      partnerStatus.className = 'form-status success';
      partnerForm.reset();
    } else {
      partnerStatus.textContent = '전송에 실패했습니다. 잠시 후 다시 시도해주세요.';
      partnerStatus.className = 'form-status error';
    }
  } catch (err) {
    partnerStatus.textContent = '네트워크 오류로 전송하지 못했습니다.';
    partnerStatus.className = 'form-status error';
  } finally {
    partnerSubmit.disabled = false;
  }
});
</script>

</body>
</html>
